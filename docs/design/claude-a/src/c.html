<!doctype html>
<html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=1280">
<title>Altyazı Çevirici · Konsept C (Sahne)</title>
<style>
/*P:CSS*/
/* ---- Konsept C: tam ekran önizleme + yüzen araç çubuğu ---- */
.c-body{flex:1;position:relative;min-height:0}
.c-body>.stage{position:absolute;inset:0}
.glass{background:rgba(255,255,255,.9);backdrop-filter:blur(24px) saturate(1.5);border:1px solid rgba(255,255,255,.75);box-shadow:var(--sh2);border-radius:14px}
.c-bar{position:absolute;top:14px;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:4px;padding:7px 8px;z-index:5;white-space:nowrap}
.c-bar>svg{width:34px;height:34px;margin:0 4px 0 2px}
.c-bar .select{height:36px;border-color:transparent;background-color:rgba(15,30,45,.05);font-weight:600;width:auto;padding-left:34px}
.c-bar .select:hover{background-color:rgba(15,30,45,.09)}
.pick{position:relative;display:flex;align-items:center}
.pick .ico{position:absolute;left:10px;pointer-events:none;color:var(--tx2)}
.vr{width:1px;height:24px;background:var(--line2);margin:0 6px}
.tool{height:36px;padding:0 11px;border-radius:9px;border:0;background:none;display:flex;gap:7px;align-items:center;font-weight:600;font-size:13px;color:var(--tx2);cursor:pointer}
.tool:hover{background:rgba(15,30,45,.06)}
.tool.active{background:var(--acc-t);color:var(--acc-dd)}
.c-stat{display:flex;align-items:center;gap:8px;font-size:12.5px;font-weight:600;padding:0 8px 0 4px;min-width:132px}
.c-stat b{color:var(--tx2);font-weight:600;font-variant-numeric:tabular-nums;margin-left:auto}
.c-bar .run{height:36px;min-width:104px}
.c-pop{position:absolute;top:80px;right:14px;width:348px;max-height:calc(100% - 94px);display:flex;flex-direction:column;z-index:6;overflow:hidden}
.c-pop section{padding:16px 18px 18px;display:flex;flex-direction:column;gap:14px;min-height:0}
.pop-h{display:flex;align-items:center;gap:8px}
.pop-h p{font-size:12.5px;color:var(--tx2)}
.c-last{position:absolute;left:14px;top:80px;width:268px;padding:12px 14px;display:flex;flex-direction:column;gap:2px;z-index:4}
.c-last b{font-weight:600;font-size:13.5px;line-height:1.35}
.c-hint{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);padding:7px 12px;border-radius:18px;font-size:12px;color:var(--tx2);display:flex;gap:7px;align-items:center;z-index:3}
body.running .c-hint{display:none}
</style></head>
<body>
<!--P:DEFS-->
<div class="app">
  <!--P:TITLEBAR-->
  <div class="c-body">
    <!--P:STAGE-->

    <div class="c-bar glass">
      <svg><use href="#mascot"/></svg>
      <label class="pick"><svg class="ico sm"><use href="#i-screen"/></svg><select class="select" aria-label="Kaynak"><option>PS Remote Play</option><option>Tüm ekran</option><option>Chiaki</option><option>Başka pencere…</option></select></label>
      <label class="pick"><svg class="ico sm"><use href="#i-max"/></svg><select class="select" aria-label="Monitör"><option>Monitör 1</option><option>Monitör 2</option></select></label>
      <span class="vr"></span>
      <div data-tabs="pop" style="display:flex;gap:2px">
        <button class="tool" data-tab="areas"><svg class="ico sm"><use href="#i-crop"/></svg>Alanlar</button>
        <button class="tool" data-tab="look"><svg class="ico sm"><use href="#i-text"/></svg>Görünüm</button>
        <button class="tool" data-tab="dict"><svg class="ico sm"><use href="#i-book"/></svg>Sözlük</button>
        <button class="tool" data-tab="adv"><svg class="ico sm"><use href="#i-sliders"/></svg>Gelişmiş</button>
      </div>
      <span class="vr"></span>
      <div class="c-stat"><i class="dot"></i><span data-status>Hazır</span><b data-ms>—</b></div>
      <button class="btn primary run" data-run-toggle><svg class="ico i-play"><use href="#i-play"/></svg><svg class="ico i-stop"><use href="#i-stop"/></svg><span data-run-label>Başlat</span></button>
    </div>

    <div class="c-last glass"><small>Son çeviri</small><b data-last></b></div>

    <div class="c-pop glass" id="pop" hidden>
      <section class="scroll" data-panel="pop:areas" hidden>
        <div class="pop-h"><div><h2>Alanlar</h2><p>Seçili kutunun tam konumu ve boyutu.</p></div><div class="sp"></div><button class="btn icon ghost" data-close aria-label="Kapat"><svg class="ico sm"><use href="#i-x"/></svg></button></div>
        <!--P:GEO-->
      </section>
      <section class="scroll" data-panel="pop:look" hidden>
        <div class="pop-h"><div><h2>Görünüm</h2><p>Sahnedeki çeviri anında güncellenir.</p></div><div class="sp"></div><button class="btn icon ghost" data-close aria-label="Kapat"><svg class="ico sm"><use href="#i-x"/></svg></button></div>
        <!--P:LOOK-->
      </section>
      <section class="scroll" data-panel="pop:dict" hidden>
        <div class="pop-h"><div><h2>Sözlük</h2><p>Oyuna özel terimler doğru çevrilsin.</p></div><div class="sp"></div><button class="btn icon ghost" data-close aria-label="Kapat"><svg class="ico sm"><use href="#i-x"/></svg></button></div>
        <!--P:DICT-->
      </section>
      <section class="scroll" data-panel="pop:adv" hidden>
        <div class="pop-h"><div><h2>Gelişmiş</h2><p>Kurulum ve bakım ayarları.</p></div><div class="sp"></div><button class="btn icon ghost" data-close aria-label="Kapat"><svg class="ico sm"><use href="#i-x"/></svg></button></div>
        <!--P:ADV-->
      </section>
    </div>

    <div class="c-hint glass"><svg class="ico sm"><use href="#i-info"/></svg>Kutuları sürükle, tutamaçlardan boyutlandır · sayısal ayar için kutuya çift tıkla</div>
  </div>
</div>
<script>
/*P:JS*/
</script>
<script>
(()=>{
const pop=document.getElementById('pop');let cur=null,busy=false;
function close(){cur=null;pop.hidden=true;document.querySelectorAll('.tool').forEach(t=>t.classList.remove('active'));}
document.addEventListener('tabchange',e=>{
  if(e.detail.g!=='pop')return;
  if(cur===e.detail.n&&!busy){close();return;}
  cur=e.detail.n;pop.hidden=false;if(cur==='look')AC.select('trans');
});
pop.addEventListener('click',e=>{if(e.target.closest('[data-close]'))close();});
document.querySelectorAll('[data-box]').forEach(b=>b.addEventListener('dblclick',()=>{busy=true;AC.showTab('pop','areas');busy=false;}));
document.addEventListener('keydown',e=>{if(e.key==='Escape')close();});
})();
</script>
</body></html>
