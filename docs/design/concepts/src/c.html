<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8"/>
<title>C — Tam ekran</title>
<link rel="stylesheet" href="boxes.css"/>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; width: 1280px; height: 800px; overflow: hidden; }
  body { font-family: "Segoe UI Variable Text", "Segoe UI Variable", "Segoe UI", Inter, sans-serif; color: #1C2128; }
  .stage { width: 1280px; height: 800px; }
  .ocr { left: 14%; top: auto; bottom: 36px; width: 72%; height: 78px; }
  .tr { left: 18%; top: auto; bottom: 136px; width: 64%; height: 100px; }
  .ocr .line { font-size: 26px; }
  .bar {
    position: absolute; top: 18px; left: 50%; transform: translateX(-50%);
    height: 52px; display: flex; align-items: center; gap: 6px;
    padding: 0 8px 0 10px; border-radius: 16px;
    background: rgba(255,255,255,.78);
    border: 1px solid rgba(255,255,255,.9);
    box-shadow: 0 10px 30px rgba(16,24,32,.16);
    backdrop-filter: blur(18px);
  }
  .bar img { width: 26px; height: 26px; margin-right: 4px; }
  .sep { width: 1px; height: 22px; background: rgba(16,24,32,.12); margin: 0 4px; }
  .chip, .ico {
    height: 34px; border: 0; background: transparent; border-radius: 10px;
    font-family: inherit; font-size: 13px; font-weight: 600; color: #1C2128;
    display: flex; align-items: center; gap: 6px; padding: 0 10px;
  }
  .ico { width: 34px; padding: 0; justify-content: center; color: #3A424C; }
  .ico svg, .chip svg { width: 16px; height: 16px; stroke: currentColor; fill: none; stroke-width: 1.7; }
  .ico.on { background: rgba(15,143,120,.12); color: #0E7C6B; }
  .go {
    height: 34px; padding: 0 14px; border: 0; border-radius: 10px; margin-left: 4px;
    background: #0F8F78; color: #fff; font-family: inherit; font-weight: 680; font-size: 13px;
  }
  .pop {
    position: absolute; right: 28px; top: 88px; width: 280px;
    background: rgba(255,255,255,.94); border-radius: 16px; padding: 14px 14px 12px;
    box-shadow: 0 16px 40px rgba(16,24,32,.2); border: 1px solid rgba(255,255,255,.8);
    backdrop-filter: blur(16px);
  }
  .pop:before { content: none; }
  .pop h2 { margin: 0; font-size: 14px; font-weight: 700; }
  .pop .sub { margin: 2px 0 12px; font-size: 12px; color: #6B7380; }
  .sl { margin-bottom: 10px; }
  .sl .t { display: flex; justify-content: space-between; font-size: 12px; color: #3A424C; margin-bottom: 6px; }
  .track { height: 6px; background: #E6E9EE; border-radius: 99px; position: relative; }
  .track u { position: absolute; left: 0; top: 0; bottom: 0; background: #14A38C; border-radius: 99px; }
  .track b {
    position: absolute; top: -5px; width: 16px; height: 16px; border-radius: 50%; background: #fff;
    border: 1px solid #D5DAE1; box-shadow: 0 1px 3px rgba(16,24,32,.2);
  }
  .colors { display: flex; gap: 8px; margin: 4px 0 12px; }
  .colors i { width: 22px; height: 22px; border-radius: 50%; border: 2px solid #fff; box-shadow: 0 0 0 1px #E1E4EA; }
  .colors i.on { box-shadow: 0 0 0 2px #0F8F78; }
  .adv { font-size: 12px; color: #6B7380; display: flex; justify-content: space-between; padding-top: 8px; border-top: 1px solid #EEF0F3; }
  .adv b { color: #1C2128; font-weight: 650; }
</style>
</head>
<body>
<div class="stage">
  <img class="shot" src="scene.svg" alt=""/>
  <div class="box ocr">
    <span class="cap">Orijinal altyazı</span>
    <span class="line">Get in the car, we're late.</span>
    <i class="nw"></i><i class="n"></i><i class="ne"></i><i class="e"></i>
    <i class="se"></i><i class="s"></i><i class="sw"></i><i class="w"></i>
  </div>
  <div class="box tr sel">
    <span class="cap">Çeviri</span>
    <p>Bu bir örnek altyazıdır, ayarları buradan görebilirsin.</p>
    <i class="nw"></i><i class="n"></i><i class="ne"></i><i class="e"></i>
    <i class="se"></i><i class="s"></i><i class="sw"></i><i class="w"></i>
  </div>
  <div class="bar">
    <img src="../../../../assets/icon.png" alt=""/>
    <button class="chip">Ekran 1 <svg viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg></button>
    <div class="sep"></div>
    <button class="ico" title="Kaynak"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="12" rx="2"/><path d="M8 20h8M12 16v4"/></svg></button>
    <button class="ico on" title="Alanlar"><svg viewBox="0 0 24 24"><rect x="4" y="6" width="16" height="12" rx="1.5"/></svg></button>
    <button class="ico" title="Görünüm"><svg viewBox="0 0 24 24"><path d="M5 7h14M5 12h10M5 17h8"/></svg></button>
    <button class="ico" title="Sözlük"><svg viewBox="0 0 24 24"><path d="M6 4h9a3 3 0 0 1 3 3v13H9a3 3 0 0 0-3 3z"/></svg></button>
    <div class="sep"></div>
    <button class="go">Başlat</button>
  </div>
  <aside class="pop">
    <h2>Çeviri kutusu</h2>
    <p class="sub">Görünüm · örnek cümle önizlemede</p>
    <div class="sl"><div class="t"><span>Yazı boyutu</span><span>28</span></div><div class="track"><u style="width:46%"></u><b style="left:42%"></b></div></div>
    <div class="sl"><div class="t"><span>Arka plan</span><span>70</span></div><div class="track"><u style="width:70%"></u><b style="left:66%"></b></div></div>
    <div class="colors">
      <i style="background:#fff"></i>
      <i style="background:#FFE14D"></i>
      <i class="on" style="background:#14A38C"></i>
    </div>
    <div class="adv"><span>Gelişmiş</span><b>420, 640 · 1080 × 120</b></div>
  </aside>
</div>
</body>
</html>
